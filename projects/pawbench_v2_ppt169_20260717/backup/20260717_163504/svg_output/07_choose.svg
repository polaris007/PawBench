  <!-- Card 1: 唯一交叉评测 -->
  <rect x="60" y="130" width="370" height="260" fill="#F2F5FA"/>
  <rect x="60" y="130" width="370" height="4" fill="#1E3A8A"/>
  <text x="90" y="175" font-size="48" font-weight="bold" fill="#1E3A8A">01</text>
  <text x="90" y="215" font-size="22" font-weight="bold" fill="#1A1A2E">唯一交叉评测平台</text>
  <rect x="90" y="230" width="40" height="2" fill="#E2E8F0"/>
  <text x="90" y="262" font-size="16" fill="#64748B">同时评估 Model + Harness + Task</text>
  <text x="90" y="290" font-size="16" fill="#64748B">适合既自研 Agent 又调优模型的团队</text>
  <text x="90" y="318" font-size="16" fill="#64748B">Harness 差距量化 — 发现部署瓶颈</text>
  <text x="90" y="346" font-size="16" fill="#64748B">150 道标准化任务覆盖 7 种原子能力</text>

  <!-- Card 2: 开源可扩展 -->
  <rect x="455" y="130" width="370" height="260" fill="#F2F5FA"/>
