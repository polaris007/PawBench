<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">01</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">为什么需要 Agent 评测</text>
  </g>
  <g id="card-1">
    <rect x="80" y="150" width="540" height="150" fill="#F2F5FA"/>
    <rect x="80" y="150" width="4" height="150" fill="#1E3A8A"/>
    <text x="110" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">升级效果无法量化</text>
    <text x="110" y="220" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">从模型升级到 Agent 框架迭代，效果好坏</text>
    <text x="110" y="245" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">依赖 cherry-pick 案例，难以形成决策依据</text>
  </g>
  <g id="card-2">
    <rect x="80" y="320" width="540" height="150" fill="#FFFFFF"/>
    <rect x="80" y="320" width="4" height="150" fill="#2563EB"/>
    <text x="110" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563EB">失败归因困难</text>
    <text x="110" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">任务失败了，不知道是模型能力不足、</text>
    <text x="110" y="415" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">Harness 调度问题还是工具调用失败</text>
  </g>
  <g id="card-3">
    <rect x="80" y="490" width="540" height="150" fill="#F2F5FA"/>
    <rect x="80" y="490" width="4" height="150" fill="#1E3A8A"/>
    <text x="110" y="525" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">现有方案局限</text>
    <text x="110" y="560" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">通用 LLM 榜单不测工具调用；学术 Benchmark</text>
    <text x="110" y="585" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">依赖公网无法内网部署，自建测试无统一标准</text>
  </g>
</svg>