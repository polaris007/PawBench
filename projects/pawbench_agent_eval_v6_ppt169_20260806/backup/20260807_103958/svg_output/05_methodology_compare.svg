<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">05</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">PawBench 方法论 × 主流范式对比</text>
  </g>
  <g id="lead">
    <text x="80" y="140" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#64748B">PawBench 与主流「同源混合、交叉创新」— 混合采用主流范式，并以交叉矩阵走出差异化</text>
  </g>
  <g id="col-same">
    <rect x="80" y="170" width="560" height="420" fill="#F2F5FA"/>
    <rect x="80" y="170" width="4" height="420" fill="#10B981"/>
    <text x="110" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#10B981">与主流一致 · 同源</text>
    <g id="same-1">
      <rect x="110" y="230" width="500" height="74" fill="#FFFFFF"/>
      <text x="130" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">确定性断言检查（automated 自动评分）</text>
      <text x="130" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">= 最终状态评估 ①</text>
    </g>
    <g id="same-2">
      <rect x="110" y="320" width="500" height="74" fill="#FFFFFF"/>
      <text x="130" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">LLM 评判 + Rubric 评分细则</text>
      <text x="130" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">= LLM-as-a-Judge ③</text>
    </g>
    <g id="same-3">
      <rect x="110" y="410" width="500" height="74" fill="#FFFFFF"/>
      <text x="130" y="440" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">Docker 沙箱隔离、离线可复现</text>
      <text x="130" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">= 沙箱环境模拟 ⑥</text>
    </g>
    <text x="110" y="540" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">此外以 transcript + 产物双重输入评分，</text>
    <text x="110" y="566" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">兼顾过程信息与最终结果</text>
  </g>
  <g id="col-unique">
    <rect x="660" y="170" width="560" height="420" fill="#F2F5FA"/>
    <rect x="660" y="170" width="4" height="420" fill="#2563EB"/>
    <text x="690" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#2563EB">PawBench 独特 · 差异化</text>
    <g id="uniq-1">
      <rect x="690" y="230" width="500" height="104" fill="#FFFFFF"/>
      <text x="710" y="258" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">Model × Harness × Task 交叉矩阵</text>
      <text x="710" y="284" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">主流把 Harness 当隐藏变量，PawBench</text>
      <text x="710" y="308" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">显式化为独立评测维度，定位真实瓶颈</text>
    </g>
    <g id="uniq-2">
      <rect x="690" y="350" width="500" height="104" fill="#FFFFFF"/>
      <text x="710" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">hybrid 混合惩罚机制</text>
      <text x="710" y="404" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">自动分 &lt; 0.75 时 LLM 分清零，</text>
      <text x="710" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">防止跳过任务 / 空文件刷分</text>
    </g>
    <g id="uniq-3">
      <rect x="690" y="470" width="500" height="104" fill="#FFFFFF"/>
      <text x="710" y="498" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">评分对框架中立，不做轨迹对齐</text>
      <text x="710" y="524" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">刻意区别于轨迹评估 ②：只依赖 transcript</text>
      <text x="710" y="548" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">与 workspace_path，多路径正确皆可得分</text>
    </g>
  </g>
  <g id="conclusion">
    <rect x="80" y="616" width="1140" height="52" fill="#1E3A8A" opacity="0.08"/>
    <text x="110" y="650" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">结论：混合主流范式 + 交叉矩阵设计，使 PawBench 在完整 Agent 评测维度上更全面</text>
  </g>
  <g id="footer">
    <text x="1200" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">05 / 14</text>
  </g>
</svg>
