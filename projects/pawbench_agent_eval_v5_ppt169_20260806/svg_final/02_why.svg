<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">02</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">为什么需要 Agent 评测</text>
  </g>
  <g id="pain-1">
    <rect x="80" y="140" width="620" height="160" fill="#F2F5FA"/>
    <rect x="80" y="140" width="4" height="160" fill="#1E3A8A"/>
    <text x="110" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">痛点一 · 升级效果无法量化</text>
    <text x="110" y="215" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">模型 / Agent 升级后效果好坏，依赖人工挑选少量案例判定</text>
    <text x="110" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">缺乏客观数据支撑，无法形成可靠的技术决策依据</text>
    <rect x="110" y="262" width="4" height="4" fill="#2563EB"/>
    <text x="122" y="275" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">→ PawBench 解法：150 道标准化任务 + 自动评分引擎，版本间可横向对比，数据说话</text>
  </g>
  <g id="pain-2">
    <rect x="720" y="140" width="500" height="160" fill="#F2F5FA"/>
    <rect x="720" y="140" width="4" height="160" fill="#1E3A8A"/>
    <text x="750" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">痛点二 · 现有方案局限</text>
    <text x="750" y="215" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">通用 LLM 榜单不评估工具调用与 Agent 行为</text>
    <text x="750" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">学术 Benchmark 依赖公网服务，无法满足内网部署</text>
    <rect x="750" y="262" width="4" height="4" fill="#2563EB"/>
    <text x="762" y="275" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">→ 开源 + Docker 沙箱隔离，数据不出网</text>
  </g>
  <g id="conclusion">
    <rect x="80" y="330" width="1140" height="56" fill="#1E3A8A" opacity="0.08"/>
    <text x="110" y="366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">需要一个标准化、可复现、内网可用的 Agent 评测方案 — PawBench</text>
  </g>
  <g id="value-1">
    <rect x="80" y="420" width="364" height="130" fill="#FFFFFF"/>
    <rect x="80" y="420" width="4" height="130" fill="#2563EB"/>
    <text x="110" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">量化升级效果</text>
    <text x="110" y="490" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">每次 Agent / LLM 升级后跑一遍，</text>
    <text x="110" y="515" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">数据说话，支持横向对比</text>
  </g>
  <g id="value-2">
    <rect x="468" y="420" width="364" height="130" fill="#FFFFFF"/>
    <rect x="468" y="420" width="4" height="130" fill="#2563EB"/>
    <text x="498" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">精准定位短板</text>
    <text x="498" y="490" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">切片分析可定位具体能力</text>
    <text x="498" y="515" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">和场景的退化点</text>
  </g>
  <g id="value-3">
    <rect x="856" y="420" width="364" height="130" fill="#FFFFFF"/>
    <rect x="856" y="420" width="4" height="130" fill="#2563EB"/>
    <text x="886" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">内网安全运行</text>
    <text x="886" y="490" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">Docker 隔离，任务数据</text>
    <text x="886" y="515" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">可改造为离线运行</text>
  </g>
  <g id="footer">
    <text x="1200" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">02 / 13</text>
  </g>
</svg>
