<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">11</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">PawBench 任务 ↔ 日常工作能力</text>
  </g>
  <g id="lead">
    <text x="80" y="140" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#64748B">日常 7 类使用场景中，6 类在 PawBench 都有强匹配任务 — 与 T053 走完全相同的评测链路</text>
  </g>
  <g id="table">
    <rect x="80" y="160" width="1120" height="36" fill="#1E3A8A"/>
    <text x="112" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">日常能力</text>
    <text x="352" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">对应任务</text>
    <text x="592" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">评分方式</text>
    <text x="832" y="184" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">考察核心</text>
    <rect x="80" y="196" width="1120" height="46" fill="#F2F5FA"/>
    <text x="112" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">邮件处理</text>
    <text x="352" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">T016 Email Triage</text>
    <text x="592" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">hybrid 0.35 / 0.65</text>
    <text x="832" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">读收件箱 → 分类（需回复/通知/垃圾）→ 结构化输出</text>
    <rect x="80" y="242" width="1120" height="46" fill="#FFFFFF"/>
    <text x="112" y="271" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">通讯录 / CRM</text>
    <text x="352" y="271" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">T026 / T027 CRM Export</text>
    <text x="592" y="271" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">hybrid 0.5 / 0.5</text>
    <text x="832" y="271" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">从 CRM 导出客户与通讯录数据，并做错误恢复</text>
    <rect x="80" y="288" width="1120" height="46" fill="#F2F5FA"/>
    <text x="112" y="317" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">内部新闻 / 资讯</text>
    <text x="352" y="317" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">T025 Newsletter Curation</text>
    <text x="592" y="317" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">hybrid 0.4 / 0.6</text>
    <text x="832" y="317" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">多源 RSS 筛选 → 编辑摘要 → 形成技术简报</text>
    <rect x="80" y="334" width="1120" height="46" fill="#FFFFFF"/>
    <text x="112" y="363" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">Excel / 表格</text>
    <text x="352" y="363" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">T140 Xlsx Recover Data</text>
    <text x="592" y="363" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">hybrid 0.6 / 0.4</text>
    <text x="832" y="363" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">读 xlsx → 修复 15 个缺值（跨 4 工作表）→ 存新文件</text>
    <rect x="80" y="380" width="1120" height="46" fill="#F2F5FA"/>
    <text x="112" y="409" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">文档（PDF）</text>
    <text x="352" y="409" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">T055 合同分析 / T058 论文摘要</text>
    <text x="592" y="409" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">llm_judge</text>
    <text x="832" y="409" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">读 PDF 合同 → 条款与风险评估 → .md；论文 → 摘要 → .txt</text>
    <rect x="80" y="426" width="1120" height="46" fill="#FFFFFF"/>
    <text x="112" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1A1A2E">代码处理</text>
    <text x="352" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">T064 Playwright E2E</text>
    <text x="592" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">hybrid 0.5 / 0.5</text>
    <text x="832" y="455" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">编写并调试端到端表单测试代码（真实代码操作）</text>
    <rect x="80" y="472" width="1120" height="46" fill="#F2F5FA"/>
    <text x="112" y="501" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">Skill 创建 / 使用</text>
    <text x="352" y="501" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">T076-T094 / SkillsBench T126-T140</text>
    <text x="592" y="501" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">hybrid 按任务</text>
    <text x="832" y="501" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">编写可复用 SKILL.md → 用该 skill 完成实际任务</text>
  </g>
  <g id="conclusion">
    <rect x="80" y="544" width="1120" height="66" fill="#1E3A8A" opacity="0.08"/>
    <text x="110" y="574" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">注：上述任务均为 hybrid 评分（自动检查 + LLM 评判）</text>
    <text x="110" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">与日常使用 OpenClaw 处理邮件 / 表格 / 文档 / 代码 / Skill 的能力高度对应，评测结果可直接指导工作流选型</text>
  </g>
  <g id="footer">
    <text x="1200" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">11 / 13</text>
  </g>
</svg>
