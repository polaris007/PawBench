<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">09</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">PawBench 评测任务体系</text>
  </g>
  <g id="lead">
    <text x="80" y="140" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#64748B">150 道任务 × 6 个源数据集 × 五维标签体系，支持精细化评测分析</text>
  </g>
  <g id="source-title">
    <rect x="80" y="160" width="4" height="28" fill="#1E3A8A"/>
    <text x="100" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">任务来源</text>
  </g>
  <g id="table">
    <rect x="80" y="200" width="540" height="36" fill="#1E3A8A"/>
    <text x="110" y="224" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">来源</text>
    <text x="330" y="224" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">数量</text>
    <text x="430" y="224" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">主要覆盖领域</text>
    <rect x="80" y="236" width="540" height="34" fill="#F2F5FA"/>
    <text x="110" y="258" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">自建任务</text>
    <text x="340" y="258" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">21</text>
    <text x="430" y="258" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">Office / SE / DA / IR / 自动化</text>
    <rect x="80" y="270" width="540" height="34" fill="#FFFFFF"/>
    <text x="110" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">claweval</text>
    <text x="340" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">52</text>
    <text x="430" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">办公协同 / 数据分析 / 内容创作</text>
    <rect x="80" y="304" width="540" height="34" fill="#F2F5FA"/>
    <text x="110" y="326" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">qwenclawbench</text>
    <text x="340" y="326" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">29</text>
    <text x="430" y="326" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">自动化 / 软件工程 / 安全对齐</text>
    <rect x="80" y="338" width="540" height="34" fill="#FFFFFF"/>
    <text x="110" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">pinchbench</text>
    <text x="340" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">23</text>
    <text x="430" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">办公流程 / 软件工程 / 信息检索</text>
    <rect x="80" y="372" width="540" height="34" fill="#F2F5FA"/>
    <text x="110" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">skillsbench</text>
    <text x="340" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">15</text>
    <text x="430" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">长程 Skill / 领域自动化</text>
    <rect x="80" y="406" width="540" height="34" fill="#FFFFFF"/>
    <text x="110" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">wildclawbench</text>
    <text x="340" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">10</text>
    <text x="430" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">办公流程 / 安全对齐</text>
  </g>
  <g id="labels-title">
    <rect x="660" y="160" width="4" height="28" fill="#1E3A8A"/>
    <text x="680" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">五维标签体系</text>
  </g>
  <g id="label-1">
    <rect x="660" y="200" width="560" height="46" fill="#F2F5FA"/>
    <text x="690" y="229" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">场景 scenario</text>
    <text x="920" y="229" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">自动化 / 信息检索 / 安全对齐</text>
  </g>
  <g id="label-2">
    <rect x="660" y="256" width="560" height="56" fill="#FFFFFF"/>
    <text x="690" y="285" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">能力 capabilities</text>
    <text x="920" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">Logic / Math / Code / Tool / Skill</text>
    <text x="920" y="302" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">/ Plan / Verify</text>
  </g>
  <g id="label-3">
    <rect x="660" y="322" width="560" height="46" fill="#F2F5FA"/>
    <text x="690" y="351" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">复杂度 complexity</text>
    <text x="920" y="351" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">L1（1-2步）/ L2（3-5步）/ L3（5+含分支）</text>
  </g>
  <g id="label-4">
    <rect x="660" y="378" width="560" height="46" fill="#FFFFFF"/>
    <text x="690" y="407" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">输入模态 modality</text>
    <text x="920" y="407" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">text / multimodal（image, audio, video）</text>
  </g>
  <g id="label-5">
    <rect x="660" y="434" width="560" height="46" fill="#F2F5FA"/>
    <text x="690" y="463" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">运行环境 environment</text>
    <text x="920" y="463" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">closed（离线复现）/ open（需联公网）</text>
  </g>
  <g id="empower-title">
    <rect x="80" y="470" width="4" height="28" fill="#1E3A8A"/>
    <text x="100" y="492" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">五维标签如何赋能评测</text>
  </g>
  <g id="emp-1">
    <rect x="80" y="508" width="364" height="90" fill="#F2F5FA"/>
    <text x="100" y="538" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">按场景分类对比</text>
    <text x="100" y="566" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">只在办公协同场景下对比模型表现，排除噪声</text>
  </g>
  <g id="emp-2">
    <rect x="468" y="508" width="364" height="90" fill="#F2F5FA"/>
    <text x="488" y="538" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">按能力定向诊断</text>
    <text x="488" y="566" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">单独筛选 Tool_Use / Planning，精准定位短板</text>
  </g>
  <g id="emp-3">
    <rect x="856" y="508" width="364" height="90" fill="#F2F5FA"/>
    <text x="876" y="538" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">按复杂度分层评估</text>
    <text x="876" y="566" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">对比 L1/L2/L3 表现差异，识别多步推理退化点</text>
  </g>
  <g id="footer">
    <text x="80" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">每道任务 5 维标签可任意组合筛选，灵活构建定制化的评测维度与对比视图</text>
    <text x="1200" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">09 / 13</text>
  </g>
</svg>
