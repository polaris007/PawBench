<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs>
    <style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1E3A8A"/>
  <text x="60" y="36" font-size="14" fill="#94A3B8">02 / 07</text>
  <text x="60" y="80" font-size="40" font-weight="bold" fill="#1E3A8A">为什么需要 Agent 评测</text>
  <rect x="60" y="96" width="80" height="3" fill="#2563EB"/>
  <text x="60" y="140" font-size="24" fill="#64748B">两大核心痛点驱动 Agent 评测需求，PawBench 提供标准化解法</text>
  
  <!-- Pain Point 1 -->
  <rect x="60" y="180" width="560" height="240" fill="#F2F5FA"/>
  <rect x="60" y="180" width="6" height="240" fill="#EF4444"/>
  <text x="90" y="220" font-size="24" font-weight="bold" fill="#1A1A2E">升级效果无法量化</text>
  <text x="90" y="260" font-size="20" fill="#64748B">从模型升级到 Agent 框架迭代，效果好坏</text>
  <text x="90" y="290" font-size="20" fill="#64748B">依赖 cherry-pick 案例判定，缺乏客观数据支撑</text>
  <text x="90" y="320" font-size="20" fill="#64748B">难以形成可靠的技术决策依据</text>
  <rect x="330" y="210" width="2" height="120" fill="#E2E8F0"/>
  <text x="350" y="220" font-size="18" font-weight="bold" fill="#10B981">→ PawBench 解法</text>
  <text x="350" y="252" font-size="17" fill="#1A1A2E">150 道标准化任务 + 自动评分</text>
  <text x="350" y="278" font-size="17" fill="#1A1A2E">跑完出分，可横向对比</text>
  <text x="350" y="304" font-size="17" fill="#1A1A2E">数据说话，告别感觉判断</text>

  <!-- Pain Point 2 -->
  <rect x="660" y="180" width="560" height="240" fill="#F2F5FA"/>
  <rect x="660" y="180" width="6" height="240" fill="#EF4444"/>
  <text x="690" y="220" font-size="24" font-weight="bold" fill="#1A1A2E">现有方案局限</text>
  <text x="690" y="260" font-size="20" fill="#64748B">通用 LLM 榜单不测工具调用能力</text>
  <text x="690" y="290" font-size="20" fill="#64748B">学术 Benchmark 依赖公网，无法内网部署</text>
  <text x="690" y="320" font-size="20" fill="#64748B">自建 Ad-hoc 测试无统一标准，维护成本高</text>
  <rect x="930" y="210" width="2" height="120" fill="#E2E8F0"/>
  <text x="950" y="220" font-size="18" font-weight="bold" fill="#10B981">→ PawBench 解法</text>
  <text x="950" y="252" font-size="17" fill="#1A1A2E">开源 + Docker 沙箱隔离</text>
  <text x="950" y="278" font-size="17" fill="#1A1A2E">完全私有化部署</text>
  <text x="950" y="304" font-size="17" fill="#1A1A2E">数据不出网，安全可控</text>

  <!-- Summary bar -->
  <rect x="60" y="460" width="1160" height="60" fill="#1E3A8A"/>
  <text x="640" y="498" font-size="22" fill="#FFFFFF" text-anchor="middle">需要一个标准化、可复现、内网可用的 Agent 评测方案</text>

  <!-- Value overview -->
  <text x="60" y="570" font-size="24" font-weight="bold" fill="#1E3A8A">PawBench 带来的价值</text>
  <rect x="60" y="595" width="360" height="80" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="628" font-size="20" font-weight="bold" fill="#1E3A8A">量化升级效果</text>
  <text x="80" y="656" font-size="17" fill="#64748B">每次 Agent/LLM 升级后跑一遍，数据说话</text>
  <rect x="440" y="595" width="360" height="80" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="628" font-size="20" font-weight="bold" fill="#1E3A8A">精准定位短板</text>
  <text x="460" y="656" font-size="17" fill="#64748B">切片分析可定位具体能力和场景的退化</text>
  <rect x="820" y="595" width="400" height="80" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="840" y="628" font-size="20" font-weight="bold" fill="#1E3A8A">内网安全运行</text>
  <text x="840" y="656" font-size="17" fill="#64748B">Docker 隔离，任务数据可改造为离线</text>
  <rect x="60" y="700" width="1160" height="1" fill="#E2E8F0"/>
</svg>