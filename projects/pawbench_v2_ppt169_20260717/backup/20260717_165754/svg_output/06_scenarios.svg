  <rect x="660" y="430" width="6" height="115" fill="#10B981"/>
  <text x="690" y="460" font-size="20" font-weight="bold" fill="#1E3A8A">持续迭代</text>
  <text x="690" y="490" font-size="16" fill="#1A1A2E">嵌入 Agent 开发迭代流程，每次发布自动评测</text>
  <text x="690" y="515" font-size="16" fill="#64748B">利用五维标签切片分析，精准定位能力变化，推动持续改进</text>

  <!-- Tech note instead of CTA -->
  <rect x="660" y="570" width="560" height="80" fill="#F8FAFC"/>
  <rect x="660" y="570" width="560" height="2" fill="#E2E8F0"/>
  <text x="690" y="598" font-size="15" fill="#1E3A8A" font-weight="bold">技术特点</text>
  <text x="690" y="622" font-size="14" fill="#64748B">支持 OpenAI 兼容 API 和私有化模型接入，纯 Python 实现，无专有依赖</text>
  <text x="690" y="642" font-size="14" fill="#64748B">Task / Judge / Runner 解耦设计，各组件可独立定制和替换</text>

