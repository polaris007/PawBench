<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">12</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">PawBench 应用场景与集成方式</text>
  </g>
  <g id="scenario-title">
    <rect x="80" y="130" width="4" height="28" fill="#1E3A8A"/>
    <text x="100" y="152" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">典型应用场景</text>
  </g>
  <g id="scen-1">
    <rect x="80" y="166" width="364" height="110" fill="#F2F5FA"/>
    <text x="110" y="196" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">模型升级评估</text>
    <text x="110" y="224" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">固定 Harness，横向跑新旧模型，看整体分和切片分变化</text>
    <text x="110" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">升级效果数据说话，形成可靠决策依据</text>
  </g>
  <g id="scen-2">
    <rect x="468" y="166" width="364" height="110" fill="#F2F5FA"/>
    <text x="498" y="196" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">Agent 框架迭代</text>
    <text x="498" y="224" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">固定模型，横向跑不同版本 Harness，验证改动未引入退化</text>
    <text x="498" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">框架稳定性可量化，回归一目了然</text>
  </g>
  <g id="scen-3">
    <rect x="856" y="166" width="364" height="110" fill="#F2F5FA"/>
    <text x="886" y="196" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">自定义 Skill 验证</text>
    <text x="886" y="224" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">新增业务 Skill 后，在相关切片上验证发现和执行效果</text>
    <text x="886" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">自定义业务任务，支持持续沉淀</text>
  </g>
  <g id="scen-4">
    <rect x="80" y="300" width="364" height="110" fill="#F2F5FA"/>
    <text x="110" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">回归测试流水线</text>
    <text x="110" y="358" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">集成到 CI 流程，每次 Agent / 模型发布自动触发评测</text>
    <text x="110" y="386" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">利用五维标签切片分析，精准定位能力变化</text>
  </g>
  <g id="int-title">
    <rect x="468" y="300" width="4" height="28" fill="#1E3A8A"/>
    <text x="488" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">集成方式</text>
  </g>
  <g id="int-1">
    <rect x="468" y="336" width="364" height="74" fill="#F2F5FA"/>
    <text x="498" y="366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">环境部署</text>
    <text x="498" y="392" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">Docker 一键部署，拉取仓库 + 配置 API 密钥即跑通 150 道任务</text>
  </g>
  <g id="int-2">
    <rect x="468" y="422" width="364" height="74" fill="#F2F5FA"/>
    <text x="498" y="452" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">内网适配</text>
    <text x="498" y="478" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">含公网依赖的任务改造为离线可运行，支持自定义任务扩展</text>
  </g>
  <g id="int-3">
    <rect x="468" y="508" width="364" height="74" fill="#F2F5FA"/>
    <text x="498" y="538" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">持续迭代</text>
    <text x="498" y="564" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">嵌入 Agent 开发迭代流程，每次发布自动评测，推动持续改进</text>
  </g>
  <g id="need-title">
    <rect x="856" y="300" width="4" height="28" fill="#1E3A8A"/>
    <text x="876" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">企业需求与能力适配</text>
  </g>
  <g id="need-table">
    <rect x="856" y="336" width="364" height="36" fill="#1E3A8A"/>
    <text x="886" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">需求</text>
    <text x="1026" y="360" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">PawBench 能力</text>
    <rect x="856" y="372" width="364" height="38" fill="#F2F5FA"/>
    <text x="886" y="397" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">内网私有化部署</text>
    <text x="1026" y="397" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#10B981">✓ 开源 + Docker，数据不出内网</text>
    <rect x="856" y="410" width="364" height="38" fill="#FFFFFF"/>
    <text x="886" y="435" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">评测完整 Agent 系统</text>
    <text x="1026" y="435" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#10B981">✓ Model × Harness × Task 全覆盖</text>
    <rect x="856" y="448" width="364" height="38" fill="#F2F5FA"/>
    <text x="886" y="473" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">自定义任务扩展</text>
    <text x="1026" y="473" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#10B981">✓ OpenJudge 生态，灵活可扩展</text>
    <rect x="856" y="486" width="364" height="38" fill="#FFFFFF"/>
    <text x="886" y="511" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">Skill 能力评估</text>
    <text x="1026" y="503" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#10B981">✓ 7 大原子能力含 Skill_Use，</text>
    <text x="1026" y="523" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#10B981">15 道专项任务</text>
    <rect x="856" y="524" width="364" height="38" fill="#F2F5FA"/>
    <text x="886" y="549" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">量化回归</text>
    <text x="1026" y="541" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#10B981">✓ 标准化任务 + 自动评分，</text>
    <text x="1026" y="561" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#10B981">CI 可集成</text>
  </g>
  <g id="tech">
    <rect x="80" y="440" width="364" height="120" fill="#FFFFFF"/>
    <rect x="80" y="440" width="4" height="120" fill="#2563EB"/>
    <text x="110" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">技术特点</text>
    <text x="110" y="500" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">· 支持 OpenAI 兼容 API 和私有化模型接入</text>
    <text x="110" y="524" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">· 纯 Python 实现，无专有依赖</text>
    <text x="110" y="548" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">· Task / Judge / Runner 解耦，可独立定制替换</text>
  </g>
  <g id="footer">
    <text x="1200" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">12 / 14</text>
  </g>
</svg>
