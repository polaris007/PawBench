<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="ending">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">04</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">为什么选择 PawBench</text>
  </g>
  <g id="left-cards">
    <rect x="80" y="150" width="520" height="120" fill="#F2F5FA"/>
    <rect x="80" y="150" width="4" height="120" fill="#1E3A8A"/>
    <text x="110" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">唯一交叉评测平台</text>
    <text x="110" y="215" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">同时评估 Model + Harness + Task，适合既自研 Agent 又调优模型的团队</text>
    <text x="110" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">Harness 差距量化 — 发现实际部署中的瓶颈</text>
    <rect x="80" y="290" width="520" height="120" fill="#FFFFFF"/>
    <rect x="80" y="290" width="4" height="120" fill="#2563EB"/>
    <text x="110" y="325" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2563EB">开源生态 + 可扩展</text>
    <text x="110" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">基于 OpenJudge 生态，可自定义任务和 Judge</text>
    <text x="110" y="380" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">阿里通义实验室持续维护，社区活跃</text>
    <rect x="80" y="430" width="520" height="120" fill="#F2F5FA"/>
    <rect x="80" y="430" width="4" height="120" fill="#1E3A8A"/>
    <text x="110" y="465" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">企业就绪</text>
    <text x="110" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">Docker 内网部署，数据不出网</text>
    <text x="110" y="520" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">可集成到 CI 流水线，每次发布自动回归</text>
  </g>
  <g id="right-roadmap">
    <rect x="660" y="150" width="540" height="400" fill="#F2F5FA"/>
    <text x="700" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">集成路径</text>
    <rect x="700" y="210" width="460" height="3" fill="#E2E8F0"/>
    <circle cx="710" cy="250" r="10" fill="#1E3A8A"/>
    <text x="740" y="256" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">Phase 1 — 部署环境（2周）</text>
    <text x="740" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#64748B">Docker 部署，跑通全量 150 任务</text>
    <rect x="707" y="260" width="6" height="50" fill="#93C5FD"/>
    <circle cx="710" cy="340" r="10" fill="#2563EB"/>
    <text x="740" y="346" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">Phase 2 — 适配内网（2周）</text>
    <text x="740" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#64748B">改造依赖公网的任务，自定义 20-30 道</text>
    <rect x="707" y="350" width="6" height="50" fill="#93C5FD"/>
    <circle cx="710" cy="430" r="10" fill="#1E3A8A"/>
    <text x="740" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">Phase 3 — 持续优化</text>
    <text x="740" y="460" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#64748B">嵌入迭代流程，切片分析推动持续改进</text>
  </g>
  <g id="bottom-bar">
    <rect x="0" y="650" width="1280" height="70" fill="#1E3A8A"/>
    <text x="640" y="692" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">github.com/agentscope-ai/PawBench</text>
  </g>
</svg>