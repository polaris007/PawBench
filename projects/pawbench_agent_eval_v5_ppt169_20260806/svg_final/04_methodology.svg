<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">04</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">主流 Agent 评测方法论全景</text>
  </g>
  <g id="lead">
    <text x="80" y="140" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#64748B">六大范式回答「怎么评」— 主流评测体系普遍是多种范式的混合实践</text>
  </g>
  <g id="card-1">
    <rect x="80" y="170" width="364" height="216" fill="#F2F5FA"/>
    <rect x="80" y="170" width="4" height="216" fill="#1E3A8A"/>
    <text x="110" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">① 最终状态评估</text>
    <text x="110" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1A1A2E">确定性后端 + 最终产物 / 状态比对</text>
    <text x="110" y="268" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">可复现、有标准答案；</text>
    <text x="110" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">但构建确定性环境工程量大</text>
    <rect x="110" y="322" width="4" height="4" fill="#2563EB"/>
    <text x="122" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">τ-bench / τ²-bench / AppWorld</text>
  </g>
  <g id="card-2">
    <rect x="468" y="170" width="364" height="216" fill="#F2F5FA"/>
    <rect x="468" y="170" width="4" height="216" fill="#1E3A8A"/>
    <text x="498" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">② 轨迹评估</text>
    <text x="498" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1A1A2E">黄金轨迹对齐 或 LLM 评判轨迹质量</text>
    <text x="498" y="268" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">可定位失败步骤；</text>
    <text x="498" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">多路径正确性难以定义</text>
    <rect x="498" y="322" width="4" height="4" fill="#2563EB"/>
    <text x="510" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">LangSmith / AgentEvals</text>
  </g>
  <g id="card-3">
    <rect x="856" y="170" width="364" height="216" fill="#F2F5FA"/>
    <rect x="856" y="170" width="4" height="216" fill="#1E3A8A"/>
    <text x="886" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">③ LLM-as-a-Judge</text>
    <text x="886" y="240" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1A1A2E">强模型 + Rubric 细则评分</text>
    <text x="886" y="268" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">可扩展、适合开放式任务；</text>
    <text x="886" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">需验证评判一致性</text>
    <rect x="886" y="322" width="4" height="4" fill="#2563EB"/>
    <text x="898" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">通用开放任务评测</text>
  </g>
  <g id="card-4">
    <rect x="80" y="410" width="364" height="216" fill="#F2F5FA"/>
    <rect x="80" y="410" width="4" height="216" fill="#1E3A8A"/>
    <text x="110" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">④ 逐步评估</text>
    <text x="110" y="480" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1A1A2E">对每一步独立校验（工具选择 / 参数 / 输出）</text>
    <text x="110" y="508" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">错误定位精确；</text>
    <text x="110" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">忽略步骤间依赖</text>
    <rect x="110" y="562" width="4" height="4" fill="#2563EB"/>
    <text x="122" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">Arize Phoenix / DeepEval</text>
  </g>
  <g id="card-5">
    <rect x="468" y="410" width="364" height="216" fill="#F2F5FA"/>
    <rect x="468" y="410" width="4" height="216" fill="#1E3A8A"/>
    <text x="498" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">⑤ pass@k 采样</text>
    <text x="498" y="480" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1A1A2E">k 次运行的成功率 / 全成功一致性</text>
    <text x="498" y="508" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">更诚实反映随机性；</text>
    <text x="498" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">评测成本随 k 上升</text>
    <rect x="498" y="562" width="4" height="4" fill="#2563EB"/>
    <text x="510" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">Claw-Eval / CI 实践</text>
  </g>
  <g id="card-6">
    <rect x="856" y="410" width="364" height="216" fill="#F2F5FA"/>
    <rect x="856" y="410" width="4" height="216" fill="#1E3A8A"/>
    <text x="886" y="445" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">⑥ 沙箱环境模拟</text>
    <text x="886" y="480" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#1A1A2E">Docker 隔离 + 离线快照可复现</text>
    <text x="886" y="508" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">真实性与可控性的折中；</text>
    <text x="886" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">环境构建成本高</text>
    <rect x="886" y="562" width="4" height="4" fill="#2563EB"/>
    <text x="898" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">GAIA / WebArena / OSWorld</text>
  </g>
  <g id="footer">
    <text x="80" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">来源：ACL 2026《A Survey on Evaluation of LLM-based Agents》等公开文献与社区实践</text>
    <text x="1200" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">04 / 13</text>
  </g>
</svg>
