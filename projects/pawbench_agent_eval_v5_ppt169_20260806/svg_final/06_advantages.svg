<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">06</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">PawBench 的优势</text>
  </g>
  <g id="lead">
    <text x="80" y="140" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" fill="#64748B">综合 9 个主流方案对比 + 企业级 Agent 评测落地需求</text>
  </g>
  <g id="adv-1">
    <rect x="80" y="170" width="364" height="180" fill="#F2F5FA"/>
    <rect x="80" y="170" width="4" height="180" fill="#1E3A8A"/>
    <text x="110" y="200" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">1</text>
    <text x="160" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">完整 Agent 评测</text>
    <text x="110" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">同时评估 Model × Harness × Task，</text>
    <text x="110" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">独立衡量模型能力与工程稳定性</text>
    <text x="110" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">核心优势</text>
  </g>
  <g id="adv-2">
    <rect x="468" y="170" width="364" height="180" fill="#F2F5FA"/>
    <rect x="468" y="170" width="4" height="180" fill="#1E3A8A"/>
    <text x="498" y="200" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">2</text>
    <text x="548" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">内网安全运行</text>
    <text x="498" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">Docker 沙箱隔离，数据不出网，</text>
    <text x="498" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">零外部依赖、安全可控</text>
    <text x="498" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">核心优势</text>
  </g>
  <g id="adv-3">
    <rect x="856" y="170" width="364" height="180" fill="#F2F5FA"/>
    <rect x="856" y="170" width="4" height="180" fill="#1E3A8A"/>
    <text x="886" y="200" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">3</text>
    <text x="936" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">Model × Harness 交叉评测</text>
    <text x="886" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">行业首创 Model × Harness 解耦设计，</text>
    <text x="886" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">定位真实瓶颈来源</text>
    <text x="886" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">核心优势</text>
  </g>
  <g id="adv-4">
    <rect x="80" y="374" width="364" height="180" fill="#F2F5FA"/>
    <rect x="80" y="374" width="4" height="180" fill="#1E3A8A"/>
    <text x="110" y="404" font-family="Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#1E3A8A">4</text>
    <text x="160" y="409" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">开源可扩展</text>
    <text x="110" y="454" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">Task / Judge / Runner 完全解耦，</text>
    <text x="110" y="480" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">基于 OpenJudge 生态，Apache 2.0</text>
    <text x="110" y="514" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">阿里通义实验室 AgentScope 团队维护</text>
  </g>
  <g id="diff-1">
    <rect x="468" y="374" width="364" height="180" fill="#FFFFFF"/>
    <rect x="468" y="374" width="4" height="180" fill="#EF4444"/>
    <text x="498" y="404" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">差异化</text>
    <text x="498" y="444" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">非纯 LLM 榜单（不测工具调用）</text>
    <text x="498" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">区别于 GAIA / AgentBench / PinchBench</text>
    <text x="498" y="496" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">等依赖公网 API 的方案</text>
  </g>
  <g id="diff-2">
    <rect x="856" y="374" width="364" height="180" fill="#FFFFFF"/>
    <rect x="856" y="374" width="4" height="180" fill="#EF4444"/>
    <text x="886" y="404" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A2E">差异化</text>
    <text x="886" y="444" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">非纯 Skill 评测（不测完整流程）</text>
    <text x="886" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">覆盖 7 大原子能力</text>
    <text x="886" y="496" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">含 Skill_Use 完整流程</text>
  </g>
  <g id="conclusion">
    <rect x="80" y="578" width="1140" height="56" fill="#1E3A8A" opacity="0.08"/>
    <text x="110" y="614" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">唯一在「完整 Agent」「内网部署」「可扩展」三项同时 ★★★★★ 的方案</text>
  </g>
  <g id="footer">
    <text x="1200" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">06 / 13</text>
  </g>
</svg>
