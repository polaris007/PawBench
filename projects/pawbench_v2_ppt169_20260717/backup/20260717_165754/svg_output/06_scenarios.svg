  <!-- Right: 集成方式 (no time estimates, no planning feel) -->
  <text x="660" y="145" font-size="22" font-weight="bold" fill="#1E3A8A">集成方式</text>

  <rect x="660" y="170" width="560" height="115" fill="#F2F5FA"/>
  <rect x="660" y="170" width="6" height="115" fill="#1E3A8A"/>
