<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs>
    <style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1E3A8A"/>
  <text x="60" y="36" font-size="14" fill="#94A3B8">04 / 07</text>
  <text x="60" y="80" font-size="40" font-weight="bold" fill="#1E3A8A">PawBench 核心特性</text>
  <rect x="60" y="96" width="80" height="3" fill="#2563EB"/>

  <!-- Col 1: Core Formula -->
  <rect x="60" y="120" width="360" height="130" fill="#F2F5FA"/>
  <rect x="60" y="120" width="360" height="4" fill="#1E3A8A"/>
  <text x="84" y="152" font-size="20" font-weight="bold" fill="#1E3A8A">核心公式</text>
  <text x="84" y="188" font-size="24" font-weight="bold" fill="#1A1A2E">Agent 表现 = f(Model, Harness)</text>
  <text x="84" y="220" font-size="15" fill="#64748B">Model：基座大模型，决定能力上限</text>
  <text x="84" y="242" font-size="15" fill="#64748B">Harness：Agent 运行时，决定稳定落地</text>

  <!-- Col 1: Matrix -->
  <rect x="60" y="265" width="360" height="120" fill="#F2F5FA"/>
  <rect x="60" y="265" width="360" height="4" fill="#2563EB"/>
  <text x="84" y="297" font-size="20" font-weight="bold" fill="#1E3A8A">三维评测矩阵</text>
  <text x="84" y="335" font-size="22" font-weight="bold" fill="#1E3A8A">9 Model × 3 Harness × 150 Task</text>
  <text x="84" y="368" font-size="22" font-weight="bold" fill="#1E3A8A">= 4,050 个评测单元</text>

  <!-- Col 1: Harness details -->
  <rect x="60" y="400" width="360" height="150" fill="#F2F5FA"/>
  <text x="84" y="432" font-size="17" font-weight="bold" fill="#1A1A2E">9 个模型：</text>
  <text x="84" y="456" font-size="14" fill="#64748B">claude-opus-4.6, deepseek-v4-pro, qwen3.7-max</text>
  <text x="84" y="478" font-size="14" fill="#64748B">qwen3.6-max-preview, qwen3.6-plus, qwen3.6-27b</text>
  <text x="84" y="500" font-size="14" fill="#64748B">glm-5.1, kimi-k2.6, qwen3.6-35b-a3b</text>
  <text x="84" y="530" font-size="17" font-weight="bold" fill="#1A1A2E">3 个 Harness：</text>
  <text x="84" y="552" font-size="15" fill="#64748B">QwenPaw（默认 baseline）/ OpenClaw / Hermes</text>

  <!-- Col 2: 3-step flow -->
  <rect x="440" y="120" width="380" height="250" fill="#F2F5FA"/>
  <rect x="440" y="120" width="380" height="4" fill="#10B981"/>
  <text x="464" y="152" font-size="20" font-weight="bold" fill="#1E3A8A">三步入式评测流程</text>

  <rect x="464" y="175" width="36" height="36" fill="#1E3A8A"/>
  <text x="482" y="200" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="512" y="200" font-size="17" font-weight="bold" fill="#1A1A2E">选择模型与 Harness</text>
  <text x="512" y="222" font-size="14" fill="#64748B">按 (Model, Harness, Task) 交叉矩阵组合</text>

  <line x1="482" y1="215" x2="482" y2="245" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="464" y="245" width="36" height="36" fill="#1E3A8A"/>
  <text x="482" y="270" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="512" y="270" font-size="17" font-weight="bold" fill="#1A1A2E">Docker 沙箱隔离运行</text>
  <text x="512" y="292" font-size="14" fill="#64748B">每任务独立容器，workspace 按需挂载</text>
  <text x="512" y="310" font-size="14" fill="#64748B">严格超时与重试机制</text>

  <line x1="482" y1="285" x2="482" y2="315" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="464" y="315" width="36" height="36" fill="#1E3A8A"/>
  <text x="482" y="340" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="512" y="340" font-size="17" font-weight="bold" fill="#1A1A2E">自动 + LLM 双重评分</text>
  <text x="512" y="362" font-size="14" fill="#64748B">Automated: Python grade() 断言检查</text>
  <text x="512" y="380" font-size="14" fill="#64748B">LLM Judge: 语义评估</text>

  <!-- Col 2: Score modes + Harness gap -->
  <rect x="440" y="385" width="380" height="75" fill="#F2F5FA"/>
  <text x="464" y="412" font-size="16" font-weight="bold" fill="#1A1A2E">评分模式</text>
  <text x="464" y="438" font-size="15" fill="#64748B">automated（确定性）| llm_judge（语义）| hybrid（混合）</text>

  <rect x="440" y="475" width="380" height="55" fill="#1E3A8A"/>
  <text x="630" y="503" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Harness 极差可达 11.5 分</text>
  <text x="630" y="523" font-size="14" fill="#93C5FD" text-anchor="middle">接近一次大模型版本升级的收益</text>

  <!-- Col 3: 7 Capabilities -->
  <rect x="840" y="120" width="380" height="310" fill="#F2F5FA"/>
  <rect x="840" y="120" width="380" height="4" fill="#2563EB"/>
  <text x="864" y="152" font-size="20" font-weight="bold" fill="#1E3A8A">七维原子能力诊断</text>

  <rect x="864" y="173" width="160" height="32" fill="#E8F0FE"/>
  <text x="875" y="195" font-size="14" font-weight="bold" fill="#1E3A8A">Tool_Use</text>
  <rect x="864" y="211" width="160" height="32" fill="#FFFFFF"/>
  <text x="875" y="233" font-size="14" font-weight="bold" fill="#1E3A8A">Skill_Use</text>
  <rect x="864" y="249" width="160" height="32" fill="#E8F0FE"/>
  <text x="875" y="271" font-size="14" font-weight="bold" fill="#1E3A8A">Code_Manipulation</text>
  <rect x="864" y="287" width="160" height="32" fill="#FFFFFF"/>
  <text x="875" y="309" font-size="14" font-weight="bold" fill="#1E3A8A">Logic_Reasoning</text>
  <rect x="864" y="325" width="160" height="32" fill="#E8F0FE"/>
  <text x="875" y="347" font-size="14" font-weight="bold" fill="#1E3A8A">Planning</text>
  <rect x="864" y="363" width="160" height="32" fill="#FFFFFF"/>
  <text x="875" y="385" font-size="14" font-weight="bold" fill="#1E3A8A">Math_Computation</text>
  <rect x="864" y="401" width="160" height="32" fill="#E8F0FE"/>
  <text x="875" y="423" font-size="14" font-weight="bold" fill="#1E3A8A">Self_Verification</text>

  <text x="1036" y="195" font-size="14" fill="#64748B">工具调用</text>
  <text x="1036" y="233" font-size="14" fill="#64748B">Skill 发现与执行</text>
  <text x="1036" y="271" font-size="14" fill="#64748B">代码操作</text>
  <text x="1036" y="309" font-size="14" fill="#64748B">逻辑推理</text>
  <text x="1036" y="347" font-size="14" fill="#64748B">任务规划</text>
  <text x="1036" y="385" font-size="14" fill="#64748B">数学计算</text>
  <text x="1036" y="423" font-size="14" fill="#64748B">自我验证</text>

  <!-- Col 3: Scenarios + Complexity -->
  <rect x="840" y="445" width="380" height="105" fill="#F2F5FA"/>
  <text x="864" y="475" font-size="18" font-weight="bold" fill="#1E3A8A">5 大应用场景</text>
  <text x="864" y="500" font-size="15" fill="#64748B">办公协同 · 软件工程 · 数据分析 · 信息检索 · 自动化脚本</text>
  <text x="864" y="530" font-size="18" font-weight="bold" fill="#1E3A8A">3 个复杂度等级</text>
  <text x="864" y="555" font-size="15" fill="#64748B">L1（1-2步）· L2（3-5步）· L3（5步以上含分支）</text>

  <rect x="60" y="700" width="1160" height="1" fill="#E2E8F0"/>
</svg>