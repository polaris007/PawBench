<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs>
    <style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1E3A8A"/>
  <text x="60" y="36" font-size="14" fill="#94A3B8">05 / 07</text>
  <text x="60" y="80" font-size="40" font-weight="bold" fill="#1E3A8A">评测任务体系</text>
  <rect x="60" y="96" width="80" height="3" fill="#2563EB"/>
  <text x="60" y="140" font-size="24" fill="#64748B">150 道任务 × 6 个源数据集 × 五维标签体系，支持精细化评测分析</text>

  <!-- Task Sources -->
  <text x="60" y="195" font-size="22" font-weight="bold" fill="#1E3A8A">任务来源</text>

  <rect x="60" y="215" width="720" height="32" fill="#1E3A8A"/>
  <text x="75" y="237" font-size="14" font-weight="bold" fill="#FFFFFF">来源</text>
  <text x="200" y="237" font-size="14" font-weight="bold" fill="#FFFFFF">数量</text>
  <text x="300" y="237" font-size="14" font-weight="bold" fill="#FFFFFF">主要覆盖领域</text>

  <rect x="60" y="247" width="720" height="28" fill="#E8F0FE"/>
  <text x="75" y="267" font-size="15" font-weight="bold" fill="#1E3A8A">自建任务</text>
  <text x="200" y="267" font-size="15" fill="#1E3A8A">21</text>
  <text x="300" y="267" font-size="14" fill="#1A1A2E">自动化、信息检索、安全对齐</text>

  <rect x="60" y="275" width="720" height="28" fill="#FFFFFF"/>
  <text x="75" y="295" font-size="15" fill="#1A1A2E">claweval</text>
  <text x="200" y="295" font-size="15" fill="#1E3A8A">52</text>
  <text x="300" y="295" font-size="14" fill="#1A1A2E">办公协同、数据分析、内容创作</text>

  <rect x="60" y="303" width="720" height="28" fill="#E8F0FE"/>
  <text x="75" y="323" font-size="15" fill="#1A1A2E">qwenclawbench</text>
  <text x="200" y="323" font-size="15" fill="#1E3A8A">29</text>
  <text x="300" y="323" font-size="14" fill="#1A1A2E">自动化、软件工程、安全对齐</text>

  <rect x="60" y="331" width="720" height="28" fill="#FFFFFF"/>
  <text x="75" y="351" font-size="15" fill="#1A1A2E">pinchbench</text>
  <text x="200" y="351" font-size="15" fill="#1E3A8A">23</text>
  <text x="300" y="351" font-size="14" fill="#1A1A2E">办公流程、软件工程、信息检索</text>

  <rect x="60" y="359" width="720" height="28" fill="#E8F0FE"/>
  <text x="75" y="379" font-size="15" fill="#1A1A2E">skillsbench</text>
  <text x="200" y="379" font-size="15" fill="#1E3A8A">15</text>
  <text x="300" y="379" font-size="14" fill="#1A1A2E">长程 Skill、领域自动化</text>

  <rect x="60" y="387" width="720" height="28" fill="#FFFFFF"/>
  <text x="75" y="407" font-size="15" fill="#1A1A2E">wildclawbench</text>
  <text x="200" y="407" font-size="15" fill="#1E3A8A">10</text>
  <text x="300" y="407" font-size="14" fill="#1A1A2E">办公流程、安全对齐</text>
  <rect x="60" y="415" width="720" height="1" fill="#E2E8F0"/>

  <!-- Five-Dimension Tag System (right side, expanded) -->
  <rect x="810" y="195" width="410" height="272" fill="#F2F5FA"/>
  <rect x="810" y="195" width="410" height="4" fill="#1E3A8A"/>
  <text x="835" y="222" font-size="20" font-weight="bold" fill="#1E3A8A">五维标签体系</text>

  <text x="835" y="248" font-size="16" font-weight="bold" fill="#1A1A2E">应用场景 scenario</text>
  <text x="835" y="266" font-size="13" fill="#64748B">Office / Software_Engineering / Data_Analysis</text>
  <text x="835" y="284" font-size="13" fill="#64748B">Information_Retrieval / Automation</text>

  <text x="835" y="308" font-size="16" font-weight="bold" fill="#1A1A2E">原子能力 capabilities</text>
  <text x="835" y="326" font-size="13" fill="#64748B">Logic / Math / Code / Tool / Skill / Plan / Verify</text>

  <text x="835" y="350" font-size="16" font-weight="bold" fill="#1A1A2E">复杂度 complexity</text>
  <text x="835" y="368" font-size="13" fill="#64748B">L1（1-2步） / L2（3-5步） / L3（5+含分支）</text>

  <text x="835" y="392" font-size="16" font-weight="bold" fill="#1A1A2E">输入模态 modality</text>
  <text x="835" y="410" font-size="13" fill="#64748B">text / multimodal（image, audio, video）</text>

  <text x="835" y="434" font-size="16" font-weight="bold" fill="#1A1A2E">运行环境 environment</text>
  <text x="835" y="452" font-size="13" fill="#64748B">closed（离线复现） / open（需联公网）</text>

  <!-- Tag system usage (replaced slice analysis results) -->
  <text x="60" y="470" font-size="22" font-weight="bold" fill="#1E3A8A">五维标签如何赋能评测</text>

  <rect x="60" y="495" width="360" height="95" fill="#F2F5FA"/>
  <rect x="60" y="495" width="4" height="95" fill="#2563EB"/>
  <text x="82" y="525" font-size="17" font-weight="bold" fill="#1A1A2E">按场景分类对比</text>
  <text x="82" y="552" font-size="15" fill="#64748B">只在办公协同场景下对比模型表现，</text>
  <text x="82" y="574" font-size="15" fill="#64748B">排除其他场景噪声，结论更聚焦</text>

  <rect x="440" y="495" width="360" height="95" fill="#F2F5FA"/>
  <rect x="440" y="495" width="4" height="95" fill="#2563EB"/>
  <text x="462" y="525" font-size="17" font-weight="bold" fill="#1A1A2E">按能力定向诊断</text>
  <text x="462" y="552" font-size="15" fill="#64748B">单独筛选 Tool_Use 或 Planning 任务，</text>
  <text x="462" y="574" font-size="15" fill="#64748B">精准定位模型在特定能力上的短板</text>

  <rect x="820" y="495" width="400" height="95" fill="#F2F5FA"/>
  <rect x="820" y="495" width="4" height="95" fill="#2563EB"/>
  <text x="842" y="525" font-size="17" font-weight="bold" fill="#1A1A2E">按复杂度分层评估</text>
  <text x="842" y="552" font-size="15" fill="#64748B">对比 L1/L2/L3 不同复杂度下的表现差异，</text>
  <text x="842" y="574" font-size="15" fill="#64748B">识别模型在多步推理中的退化点</text>

  <rect x="60" y="615" width="1160" height="40" fill="#1E3A8A"/>
  <text x="640" y="641" font-size="17" fill="#FFFFFF" text-anchor="middle">每道任务 5 维标签可任意组合筛选，灵活构建定制化的评测维度和对比视图</text>
  <rect x="60" y="700" width="1160" height="1" fill="#E2E8F0"/>
</svg>