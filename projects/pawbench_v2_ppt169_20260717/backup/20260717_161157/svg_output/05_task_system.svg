<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs>
    <style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1E3A8A"/>
  <text x="60" y="36" font-size="14" fill="#94A3B8">05 / 07</text>
  <text x="60" y="80" font-size="40" font-weight="bold" fill="#1E3A8A">评测任务体系</text>
  <rect x="60" y="96" width="80" height="3" fill="#2563EB"/>
  <text x="60" y="140" font-size="24" fill="#64748B">150 道任务 × 6 个源数据集 × 五维标签体系，支持精细化切片分析</text>

  <!-- Task Sources -->
  <text x="60" y="195" font-size="22" font-weight="bold" fill="#1E3A8A">任务来源</text>
  
  <rect x="60" y="215" width="720" height="32" fill="#1E3A8A"/>
  <text x="75" y="237" font-size="14" font-weight="bold" fill="#FFFFFF">来源</text>
  <text x="200" y="237" font-size="14" font-weight="bold" fill="#FFFFFF">数量</text>
  <text x="300" y="237" font-size="14" font-weight="bold" fill="#FFFFFF">主要覆盖</text>

  <rect x="60" y="247" width="720" height="28" fill="#E8F0FE"/>
  <text x="75" y="267" font-size="15" font-weight="bold" fill="#1E3A8A">自建任务</text>
  <text x="200" y="267" font-size="15" fill="#1E3A8A">21</text>
  <text x="300" y="267" font-size="14" fill="#1A1A2E">自动化、信息检索、安全对齐</text>

  <rect x="60" y="275" width="720" height="28" fill="#FFFFFF"/>
  <text x="75" y="295" font-size="15" fill="#1A1A2E">claweval</text>
  <text x="200" y="295" font-size="15" fill="#1E3A8A">52</text>
  <text x="300" y="295" font-size="14" fill="#1A1A2E">办公协同、数据分析、内容创作</text>

  <rect x="60" y="303" width="720" height="28" fill="#E8F0FE"/>
  <text x="75" y="323" font-size="15" fill="#1A1A2E">qwenclawbench</text>
  <text x="200" y="323" font-size="15" fill="#1E3A8A">29</text>
  <text x="300" y="323" font-size="14" fill="#1A1A2E">自动化、软件工程、安全对齐</text>

  <rect x="60" y="331" width="720" height="28" fill="#FFFFFF"/>
  <text x="75" y="351" font-size="15" fill="#1A1A2E">pinchbench</text>
  <text x="200" y="351" font-size="15" fill="#1E3A8A">23</text>
  <text x="300" y="351" font-size="14" fill="#1A1A2E">办公流程、软件工程、信息检索</text>

  <rect x="60" y="359" width="720" height="28" fill="#E8F0FE"/>
  <text x="75" y="379" font-size="15" fill="#1A1A2E">skillsbench</text>
  <text x="200" y="379" font-size="15" fill="#1E3A8A">15</text>
  <text x="300" y="379" font-size="14" fill="#1A1A2E">长程 Skill、领域自动化</text>

  <rect x="60" y="387" width="720" height="28" fill="#FFFFFF"/>
  <text x="75" y="407" font-size="15" fill="#1A1A2E">wildclawbench</text>
  <text x="200" y="407" font-size="15" fill="#1E3A8A">10</text>
  <text x="300" y="407" font-size="14" fill="#1A1A2E">办公流程、安全对齐</text>
  <rect x="60" y="415" width="720" height="1" fill="#E2E8F0"/>

  <!-- Five-Dimension Tag System -->
  <rect x="810" y="215" width="410" height="210" fill="#F2F5FA"/>
  <rect x="810" y="215" width="410" height="4" fill="#1E3A8A"/>
  <text x="835" y="245" font-size="20" font-weight="bold" fill="#1E3A8A">五维标签体系</text>

  <text x="835" y="280" font-size="16" font-weight="bold" fill="#1A1A2E">应用场景 scenario</text>
  <text x="835" y="302" font-size="14" fill="#64748B">Office_Productivity / Software_Engineering</text>

  <text x="835" y="332" font-size="16" font-weight="bold" fill="#1A1A2E">原子能力 capabilities</text>
  <text x="835" y="354" font-size="14" fill="#64748B">Logic / Math / Code / Tool / Skill / Plan / Self-Verify</text>

  <text x="835" y="384" font-size="16" font-weight="bold" fill="#1A1A2E">复杂度 complexity</text>
  <text x="835" y="406" font-size="14" fill="#64748B">L1（1-2步）/ L2（3-5步）/ L3（5+步含分支）</text>

  <!-- Modality + Environment -->
  <text x="850" y="432" font-size="16" font-weight="bold" fill="#1A1A2E">输入模态 modality</text>
  <text x="850" y="454" font-size="14" fill="#64748B">text / multimodal（image, audio, video）</text>

  <text x="850" y="480" font-size="16" font-weight="bold" fill="#1A1A2E">运行环境 environment</text>
  <text x="850" y="502" font-size="14" fill="#64748B">closed（离线可复现）/ open（需联公网）</text>

  <!-- Slice Analysis -->
  <text x="60" y="470" font-size="22" font-weight="bold" fill="#1E3A8A">切片分析的价值</text>

  <rect x="60" y="495" width="360" height="80" fill="#F2F5FA"/>
  <rect x="60" y="495" width="4" height="80" fill="#2563EB"/>
  <text x="82" y="525" font-size="17" font-weight="bold" fill="#1A1A2E">按能力切片</text>
  <text x="82" y="552" font-size="15" fill="#64748B">Skill_Use 平均 47.2，所有能力中最弱</text>

  <rect x="440" y="495" width="360" height="80" fill="#F2F5FA"/>
  <rect x="440" y="495" width="4" height="80" fill="#2563EB"/>
  <text x="462" y="525" font-size="17" font-weight="bold" fill="#1A1A2E">按模态切片</text>
  <text x="462" y="552" font-size="15" fill="#64748B">纯文本 74.1 vs 多模态 64.0，后者是共同短板</text>

  <rect x="820" y="495" width="400" height="80" fill="#F2F5FA"/>
  <rect x="820" y="495" width="4" height="80" fill="#2563EB"/>
  <text x="842" y="525" font-size="17" font-weight="bold" fill="#1A1A2E">按复杂度切片</text>
  <text x="842" y="552" font-size="15" fill="#64748B">L3 长任务最易暴露模型/Harness 差异</text>

  <rect x="60" y="600" width="1160" height="40" fill="#1E3A8A"/>
  <text x="640" y="626" font-size="17" fill="#FFFFFF" text-anchor="middle">每道任务支持 5 维交叉筛选，任意组合切分，精准定位瓶颈所在</text>
  <rect x="60" y="700" width="1160" height="1" fill="#E2E8F0"/>
</svg>