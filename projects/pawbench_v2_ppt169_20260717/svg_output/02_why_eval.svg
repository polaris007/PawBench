<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <defs>
    <style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style>
  </defs>
  <!-- Background + top accent -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1E3A8A"/>

  <!-- Header -->
  <text x="60" y="36" font-size="14" fill="#94A3B8">02 / 07</text>
  <text x="60" y="80" font-size="40" font-weight="bold" fill="#1E3A8A">为什么需要 Agent 评测</text>
  <rect x="60" y="96" width="80" height="3" fill="#2563EB"/>
  <text x="60" y="135" font-size="22" fill="#64748B">两大核心痛点驱动 Agent 评测需求，PawBench 提供标准化解法</text>

  <!-- ═══ Card 1: 升级效果无法量化 ═══ -->
  <rect x="60" y="165" width="1160" height="145" fill="#F2F5FA"/>
  <rect x="60" y="165" width="6" height="145" fill="#EF4444"/>

  <!-- Left: 痛点 -->
  <text x="90" y="205" font-size="24" font-weight="bold" fill="#1A1A2E">升级效果无法量化</text>
  <text x="90" y="245" font-size="20" fill="#64748B">模型 / Agent 升级后效果好坏依赖 cherry-pick 案例判定</text>
  <text x="90" y="278" font-size="20" fill="#64748B">缺乏客观数据支撑，无法形成可靠的技术决策依据</text>

  <!-- Divider -->
  <rect x="610" y="185" width="2" height="105" fill="#E2E8F0"/>

  <!-- Right: 解法 -->
  <text x="635" y="205" font-size="18" font-weight="bold" fill="#10B981">→ PawBench 解法</text>
  <text x="635" y="245" font-size="20" fill="#1A1A2E">150 道标准化任务 + 自动评分引擎</text>
  <text x="635" y="278" font-size="20" fill="#1A1A2E">跑完即出分，版本间可横向对比，数据说话</text>

  <!-- ═══ Card 2: 现有方案局限 ═══ -->
  <rect x="60" y="330" width="1160" height="145" fill="#F2F5FA"/>
  <rect x="60" y="330" width="6" height="145" fill="#EF4444"/>

  <!-- Left: 痛点 -->
  <text x="90" y="370" font-size="24" font-weight="bold" fill="#1A1A2E">现有方案局限</text>
  <text x="90" y="410" font-size="20" fill="#64748B">通用 LLM 榜单不评估工具调用与 Agent 行为</text>
  <text x="90" y="443" font-size="20" fill="#64748B">学术 Benchmark 依赖公网服务，无法满足内网部署要求</text>

  <!-- Divider -->
  <rect x="610" y="350" width="2" height="105" fill="#E2E8F0"/>

  <!-- Right: 解法 -->
  <text x="635" y="370" font-size="18" font-weight="bold" fill="#10B981">→ PawBench 解法</text>
  <text x="635" y="410" font-size="20" fill="#1A1A2E">开源 + Docker 沙箱隔离，完全私有化部署</text>
  <text x="635" y="443" font-size="20" fill="#1A1A2E">数据不出网，安全可控，零外部依赖</text>

  <!-- Summary bar -->
  <rect x="60" y="500" width="1160" height="45" fill="#1E3A8A"/>
  <text x="640" y="529" font-size="22" fill="#FFFFFF" text-anchor="middle">需要一个标准化、可复现、内网可用的 Agent 评测方案</text>

  <!-- PawBench 带来的价值 -->
  <text x="60" y="580" font-size="24" font-weight="bold" fill="#1E3A8A">PawBench 带来的价值</text>

  <rect x="60" y="605" width="360" height="75" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="637" font-size="20" font-weight="bold" fill="#1E3A8A">量化升级效果</text>
  <text x="80" y="665" font-size="17" fill="#64748B">每次 Agent / LLM 升级后跑一遍，数据说话</text>

  <rect x="440" y="605" width="360" height="75" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="460" y="637" font-size="20" font-weight="bold" fill="#1E3A8A">精准定位短板</text>
  <text x="460" y="665" font-size="17" fill="#64748B">切片分析可定位具体能力和场景的退化</text>

  <rect x="820" y="605" width="400" height="75" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="840" y="637" font-size="20" font-weight="bold" fill="#1E3A8A">内网安全运行</text>
  <text x="840" y="665" font-size="17" fill="#64748B">Docker 隔离，任务数据可改造为离线</text>

  <!-- Footer line -->
  <rect x="60" y="704" width="1160" height="1" fill="#E2E8F0"/>
</svg>
