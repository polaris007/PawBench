<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="section-marker">
    <rect x="0" y="0" width="12" height="720" fill="#1E3A8A"/>
    <text x="40" y="80" font-family="Microsoft YaHei, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E3A8A" opacity="0.15">03</text>
  </g>
  <g id="header">
    <rect x="80" y="60" width="60" height="3" fill="#1E3A8A"/>
    <text x="80" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#1A1A2E">PawBench 核心特性</text>
  </g>
  <g id="card-1">
    <rect x="80" y="150" width="350" height="460" fill="#F2F5FA"/>
    <rect x="80" y="150" width="6" height="460" fill="#1E3A8A"/>
    <text x="110" y="195" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">交叉评测矩阵</text>
    <text x="110" y="235" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1A2E">9 模型 × 3 Harness × 150 任务</text>
    <text x="110" y="265" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">= 4,050 个评测单元</text>
    <text x="110" y="305" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">精准定位瓶颈在模型还是框架</text>
    <text x="110" y="345" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">支持 3 个主流 Harness：</text>
    <text x="130" y="375" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· QwenPaw（默认 baseline）</text>
    <text x="130" y="405" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· OpenClaw（通用开源 Runtime）</text>
    <text x="130" y="435" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· Hermes（社区对照组）</text>
    <text x="110" y="475" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">Harness 极差可达 11.5 分，</text>
    <text x="110" y="505" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">接近一次大模型版本升级的收益</text>
  </g>
  <g id="card-2">
    <rect x="465" y="150" width="350" height="460" fill="#FFFFFF"/>
    <rect x="465" y="150" width="6" height="460" fill="#2563EB"/>
    <text x="495" y="195" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#2563EB">三步入式评测</text>
    <text x="495" y="235" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">Step 1: 选择模型与 Harness</text>
    <text x="495" y="275" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">Step 2: Docker 沙箱隔离运行</text>
    <text x="515" y="305" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#64748B">每个任务在独立容器中执行</text>
    <text x="515" y="330" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#64748B">workspace 文件按需挂载</text>
    <text x="515" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#64748B">严格超时与重试机制</text>
    <text x="495" y="395" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">Step 3: 自动 + LLM 双重评分</text>
    <text x="515" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#64748B">Automated: Python grade() 断言检查</text>
    <text x="515" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#64748B">LLM Judge: 语义评估</text>
    <text x="515" y="475" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#64748B">Hybrid: 自动分 &lt; 0.75 时清零</text>
  </g>
  <g id="card-3">
    <rect x="850" y="150" width="350" height="460" fill="#F2F5FA"/>
    <rect x="850" y="150" width="6" height="460" fill="#1E3A8A"/>
    <text x="880" y="195" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">七维能力诊断</text>
    <text x="880" y="235" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">7 大原子能力切片分析</text>
    <text x="900" y="275" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· Tool_Use — 工具调用</text>
    <text x="900" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· Skill_Use — Skill 发现与执行</text>
    <text x="900" y="345" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· Code_Manipulation — 代码操作</text>
    <text x="900" y="380" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· Logic_Reasoning — 逻辑推理</text>
    <text x="900" y="415" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· Planning — 任务规划</text>
    <text x="900" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· Math_Computation — 数学计算</text>
    <text x="900" y="485" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1A1A2E">· Self_Verification — 自我验证</text>
    <text x="880" y="530" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">5 大应用场景打标</text>
    <text x="880" y="560" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#64748B">3 个复杂度等级 (L1-L3)</text>
  </g>
</svg>