<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="ending">
  <defs>
    <style>text{font-family:"Microsoft YaHei",Arial,sans-serif}</style>
  </defs>
  <rect x="0" y="0" width="480" height="720" fill="#1E3A8A"/>
  <rect x="480" y="0" width="800" height="720" fill="#FFFFFF"/>

  <text x="80" y="260" font-size="64" font-weight="bold" fill="#FFFFFF">PawBench</text>
  <rect x="80" y="290" width="120" height="3" fill="#93C5FD"/>
  <text x="80" y="340" font-size="22" fill="#93C5FD" letter-spacing="3">AGENT EVALUATION</text>
  <text x="80" y="380" font-size="22" fill="#93C5FD" letter-spacing="3">MADE SYSTEMATIC</text>

  <text x="540" y="100" font-size="40" font-weight="bold" fill="#1E3A8A">为什么选择 PawBench</text>
  <rect x="540" y="116" width="80" height="3" fill="#2563EB"/>

  <!-- Card 1 -->
  <rect x="540" y="145" width="340" height="200" fill="#F2F5FA"/>
  <rect x="540" y="145" width="340" height="4" fill="#1E3A8A"/>
  <text x="570" y="190" font-size="48" font-weight="bold" fill="#1E3A8A">01</text>
  <text x="570" y="225" font-size="22" font-weight="bold" fill="#1A1A2E">唯一交叉评测平台</text>
  <text x="570" y="258" font-size="16" fill="#64748B">同时评估 Model + Harness + Task</text>
  <text x="570" y="284" font-size="16" fill="#64748B">适合既自研 Agent 又调优模型的团队</text>
  <text x="570" y="310" font-size="16" fill="#64748B">Harness 差距量化 — 发现部署瓶颈</text>

  <!-- Card 2 -->
  <rect x="900" y="145" width="320" height="200" fill="#F2F5FA"/>
  <rect x="900" y="145" width="320" height="4" fill="#2563EB"/>
  <text x="930" y="190" font-size="48" font-weight="bold" fill="#2563EB">02</text>
  <text x="930" y="225" font-size="22" font-weight="bold" fill="#1A1A2E">开源生态 + 可扩展</text>
  <text x="930" y="258" font-size="16" fill="#64748B">基于 OpenJudge 生态</text>
  <text x="930" y="284" font-size="16" fill="#64748B">可自定义任务和 Judge</text>
  <text x="930" y="310" font-size="16" fill="#64748B">阿里通义实验室持续维护</text>

  <!-- Card 3 -->
  <rect x="540" y="365" width="340" height="200" fill="#F2F5FA"/>
  <rect x="540" y="365" width="340" height="4" fill="#10B981"/>
  <text x="570" y="410" font-size="48" font-weight="bold" fill="#10B981">03</text>
  <text x="570" y="445" font-size="22" font-weight="bold" fill="#1A1A2E">企业就绪</text>
  <text x="570" y="478" font-size="16" fill="#64748B">Docker 内网部署，数据不出网</text>
  <text x="570" y="504" font-size="16" fill="#64748B">可集成到 CI 流水线</text>
  <text x="570" y="530" font-size="16" fill="#64748B">每次发布自动回归测试</text>

  <!-- Card 4: GitHub CTA -->
  <rect x="900" y="365" width="320" height="200" fill="#1E3A8A"/>
  <text x="1060" y="410" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">开始使用</text>
